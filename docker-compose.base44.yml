# Base44 dev environment.
#  renderer: torch-free preview renderer (PNG/GIF storyboard + pose-guide MP4),
#            watches source and re-renders into .base44/preview/output/.
#  web: FastAPI app serving the preview page (/) and the computer-use chat (/chat),
#       plus the chat API (/api/chat). Port 3000.
services:
  renderer:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - pip-cache:/root/.cache/pip
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null &&
             pip install -q opencv-python-headless 'numpy>=1.26' 'Pillow>=10' &&
             sh .base44/preview/render_loop.sh"
    environment:
      - PYTHONUNBUFFERED=1

  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - web-pip-cache:/root/.cache/pip
    command: >
      sh -c "pip install -q -r agent/requirements.txt &&
             uvicorn agent.app:app --host 0.0.0.0 --port 3000 --reload"
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  pip-cache:
  web-pip-cache:
