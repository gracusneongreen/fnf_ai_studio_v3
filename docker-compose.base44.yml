# Base44 dev environment. The sandbox has no GPU, so only the torch-free paths
# (sneak-peek storyboard + pose-guide preview) run here. The renderer watches
# the source and re-renders; the web service serves the results on port 3000.
services:
  renderer:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - pip-cache:/root/.cache/pip
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null &&
             pip install -q opencv-python-headless 'numpy>=1.26' 'Pillow>=10' &&
             sh .base44/preview/render_loop.sh"
    environment:
      - PYTHONUNBUFFERED=1

  web:
    image: python:3.12-slim
    working_dir: /app/.base44/preview
    volumes:
      - ./:/app
    command: python -m http.server 3000 --bind 0.0.0.0
    ports:
      - "3000:3000"

volumes:
  pip-cache:
